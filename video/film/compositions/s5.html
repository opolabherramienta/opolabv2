    (function () {
      const root = document.querySelector("#s5-cursor").parentNode;
      OPO.fillIcons(root);
      // Month grid exactly as the app shows November 2026 (starts on Sunday 1).
      const cells = document.querySelector("#s5-cells");
      const pos = (idx) => ({ x: (idx % 7) * 182, y: Math.floor(idx / 7) * 126 });
      let html = "";
      for (let idx = 0; idx < 42; idx++) {
        const day = idx < 6 ? 26 + idx : idx <= 35 ? idx - 5 : idx - 35;
        const out = idx < 6 || idx > 35;
        const p = pos(idx);
        html += '<div class="s5-cell' + (out ? " out" : "") + '" style="left:' + p.x + "px;top:" + p.y + 'px"><i>' + day + "</i></div>";
      }
      const chip = (cls, idx, slot, label, extra) => {
        const p = pos(idx);
        return '<div class="s5-chip ' + cls + " " + (extra || "") + '" style="left:' + (p.x + 12) + "px;top:" + (p.y + 48 + slot * 38) + 'px">' + (label || "") + "</div>";
      };
      const nov = (d) => d + 5;
      [2, 3, 4, 5, 6, 9, 10, 11, 12, 13, 16, 17, 18, 19, 20, 23, 24, 25, 26, 27].forEach((d) => { html += chip("t", nov(d), 0, "", "s5-t"); });
      [[nov(5), 1, "+3"], [nov(9), 1, "+7"], [nov(16), 1, "+14"], [37, 0, "+30"]].forEach(([idx, slot, label], i) => { html += chip("r", idx, slot, label, "s5-rk s5-rk" + i); });
      [6, 10, 12, 13, 17, 19, 20, 24, 26, 27].forEach((d) => { html += chip("r", nov(d), 1, "", "s5-r"); });
      html += chip("r", nov(30), 0, "", "s5-r");
      [7, 14, 21, 28].forEach((d) => { html += chip("p", nov(d), 0, "", "s5-p"); });
      [15, 29].forEach((d) => { html += chip("s", nov(d), 0, "", "s5-s"); });
      cells.innerHTML = html;

      const tl = gsap.timeline({ paused: true });
      const hide = (sel) => tl.fromTo(sel, { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      hide("#s5-cal"); hide(".s5-li"); hide("#s5-days b"); hide("#s5-dias"); hide(".s5-chip");
      tl.fromTo("#s5-cursor", { x: 1700, y: 1150 }, { x: 1700, y: 1150, duration: 0.01 }, 0);
      tl.fromTo("#s5-form", { y: 80, scale: 0.94, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "expo.out" }, 0.05);
      // "tu fecha de examen" / "tus horas a la semana": typed in.
      tl.fromTo("#s5-v1", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.8, ease: "steps(19)" }, 0.75);
      tl.fromTo("#s5-v2", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.2, ease: "steps(2)" }, 2.15);
      tl.fromTo("#s5-btn", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, 2.9);
      // "te monta el plan": click, and the button opens into the calendar.
      tl.to("#s5-cursor", { x: 960 - 18, y: 730 - 8, duration: 0.6, ease: "power3.out" }, 3.3);
      tl.to("#s5-cursor", { scale: 0.82, duration: 0.07, yoyo: true, repeat: 1 }, 3.98);
      tl.to("#s5-btn", { y: 10, boxShadow: "0 0px 0 #6a3fe0", duration: 0.07, yoyo: true, repeat: 1 }, 4.0);
      tl.to("#s5-form", { scale: 0.8, opacity: 0, filter: "blur(10px)", duration: 0.22, ease: "power2.in" }, 4.14);
      tl.to("#s5-cursor", { x: 1960, y: 900, duration: 0.5, ease: "power3.in" }, 4.2);
      tl.fromTo("#s5-cal", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "expo.out", immediateRender: false }, 4.25);
      // "temas nuevos"
      tl.to("#s5-l1", { opacity: 1, duration: 0.15 }, 5.4);
      tl.fromTo("#s5-l1", { x: 40 }, { x: 0, duration: 0.3, ease: "power4.out" }, 5.4);
      tl.to(".s5-t", { opacity: 1, duration: 0.1, stagger: 0.035 }, 5.45);
      tl.fromTo(".s5-t", { y: -30, scale: 0.6 }, { y: 0, scale: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.035 }, 5.45);
      // "repasos a los tres, siete, catorce y treinta días": they leave from the day you studied.
      tl.to("#s5-l2", { opacity: 1, duration: 0.15 }, 6.5);
      tl.fromTo("#s5-l2", { x: 40 }, { x: 0, duration: 0.3, ease: "power4.out" }, 6.5);
      const src = pos(nov(2));
      [[nov(5), 1, 7.45], [nov(9), 1, 7.95], [nov(16), 1, 8.5], [37, 0, 9.1]].forEach(([idx, slot, t], i) => {
        const p = pos(idx);
        tl.to(".s5-rk" + i, { opacity: 1, duration: 0.06 }, t);
        tl.fromTo(".s5-rk" + i, { x: src.x - p.x, y: src.y - p.y - slot * 38, scale: 0.7 }, { x: 0, y: 0, scale: 1, duration: 0.42, ease: "power3.out" }, t);
        tl.to("#s5-days b:nth-child(" + (i + 1) + ")", { opacity: 1, duration: 0.08 }, t);
        tl.fromTo("#s5-days b:nth-child(" + (i + 1) + ")", { scale: 1.8 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, t);
      });
      tl.to("#s5-dias", { opacity: 1, duration: 0.15 }, 9.5);
      tl.to(".s5-r", { opacity: 1, duration: 0.1, stagger: 0.04 }, 9.55);
      tl.fromTo(".s5-r", { scale: 0.5 }, { scale: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.04 }, 9.55);
