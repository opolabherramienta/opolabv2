<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bricolage Grotesque";
        src: url("assets/fonts/bricolage-800.woff2") format("woff2");
        font-weight: 800;
      }
      @font-face {
        font-family: "Figtree";
        src: url("assets/fonts/figtree.woff2") format("woff2");
        font-weight: 300 900;
      }
      :root {
        --boli: #8b5cf6;
        --boli-edge: #6a3fe0;
        --azul: #3b82f6;
        --azul-edge: #2563eb;
        --subrayador: #fbbf24;
        --subrayador-edge: #d4950a;
        --aprobado: #10b981;
        --aprobado-edge: #0a8f63;
        --rojo: #f0483e;
        --papel: #f4efff;
        --tinta: #1e1a38;
        --s100: #eee9fb;
        --s200: #ded7f3;
        --s300: #c5bce0;
        --s400: #968db5;
        --s500: #6e6690;
        --display: "Bricolage Grotesque", sans-serif;
        --body: "Figtree", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--boli);
      }
      .abs {
        position: absolute;
      }
      .full {
        position: absolute;
        inset: 0;
      }
      .disp {
        font-family: var(--display);
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .txt {
        font-family: var(--body);
        font-weight: 600;
      }
      /* Tactile surface of the app: thick border, heavier bottom edge. */
      .edge {
        background: #fff;
        border: 3px solid var(--s200);
        border-bottom-width: 8px;
        border-radius: 36px;
      }
      /* Exam ball, same five states as the app. */
      .ball {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        font-family: var(--display);
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .ball > .lay {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .b-off {
        background: var(--s100);
        color: var(--s400);
        box-shadow: inset 0 -0.07em 0 var(--s200);
      }
      .b-sel {
        background: #fff;
        color: #6d28d9;
        box-shadow:
          inset 0 0 0 0.09em #c4b5fd,
          inset 0 -0.16em 0 #ede9fe;
      }
      .b-sta {
        background: var(--subrayador);
        color: var(--tinta);
        box-shadow: inset 0 -0.2em 0 var(--subrayador-edge);
      }
      .b-stu {
        background: var(--azul);
        color: #fff;
        box-shadow: inset 0 -0.2em 0 var(--azul-edge);
      }
      .b-mas {
        background: var(--aprobado);
        color: #fff;
        box-shadow: inset 0 -0.2em 0 var(--aprobado-edge);
      }
      .cursor {
        position: absolute;
        width: 92px;
        height: 92px;
        z-index: 50;
      }
    </style>
    <script>
      // Shared helpers for the scenes: the app's own icon paths and ball states.
      window.OPO = {
        paths: {

          calendar: "M4.5 6.5h15v13h-15zM4.5 10.5h15M8.5 3.5v4M15.5 3.5v4",
          flame:
            "M12 21c3.6 0 6.5-2.7 6.5-6.4 0-3-1.9-4.8-3.2-6.6-.9-1.3-1.3-2.7-1.3-4.5-2.9 1.5-5 4.3-5 7.3-1-.6-1.6-1.5-1.9-2.7C6 9.6 5.5 11.5 5.5 14.6 5.5 18.3 8.4 21 12 21Z",
          check: "m5 12.5 4.5 4.5L19 7.5",
          clock: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18ZM12 7.5V12l3 2",
          target:
            "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18ZM12 16.5a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9ZM12 12.5a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1Z",
          repeat:
            "M4.5 11a7 7 0 0 1 12-4.5L19 9M19 4.5V9h-4.5M19.5 13a7 7 0 0 1-12 4.5L5 15M5 19.5V15h4.5",
        },
        icon(name, size, stroke) {
          return (
            '<svg width="' +
            size +
            '" height="' +
            size +
            '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="' +
            (stroke || 2.2) +
            '"><path d="' +
            this.paths[name] +
            '"/></svg>'
          );
        },
        cursor:
          '<svg viewBox="0 0 92 92" width="92" height="92"><path d="M18 8 L18 70 L34 55 L45 82 L57 77 L46 51 L68 51 Z" fill="#1e1a38" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg>',
        // The example temario of the app's own preview: state by topic number.
        state(n) {
          return ["mas", "off", "sta", "mas", "off", "sel", "stu", "off", "sel", "stu"][n % 10];
        },
        fillIcons(root) {
          root.querySelectorAll("[data-icon]").forEach((el) => {
            el.innerHTML = this.icon(
              el.dataset.icon,
              el.dataset.size || 24,
              el.dataset.stroke,
            );
          });
          root.querySelectorAll("[data-cursor]").forEach((el) => {
            el.innerHTML = this.cursor;
          });
        },
      };
    </script>
